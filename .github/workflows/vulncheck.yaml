name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  vulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true
      - name: Run govulncheck
        run: make vulncheck
